name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only needs to check out and test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The plugin ships the bundled engine committed in skills/token-parity/bin; it must match the source.
      - name: Plugin bundle is up to date
        run: git diff --exit-code -- skills/token-parity/bin || (echo "Run pnpm build and commit skills/token-parity/bin/token-parity.mjs" && exit 1)
