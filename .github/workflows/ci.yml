name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The plugin ships the bundled engine committed in skills/token-parity/bin; it must match the source.
      - name: Plugin bundle is up to date
        run: git diff --exit-code -- skills/token-parity/bin || (echo "Run pnpm build and commit skills/token-parity/bin/token-parity.mjs" && exit 1)
